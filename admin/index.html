<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التحكم — PuzzleX Media</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=7">
  <link rel="stylesheet" href="/admin/blog.css?v=1">
  <link rel="stylesheet" href="/invoice-doc.css?v=1">
  <link rel="stylesheet" href="/admin/invoices.css?v=2">
</head>
<body>
  <!-- sign in -->
  <main class="login" id="login" hidden>
    <form class="login-card" id="login-form" novalidate>
      <img class="login-logo" src="/assets/icon.svg" alt="" width="56" height="56">
      <h1>لوحة التحكم</h1>
      <p class="muted">PuzzleX Media — كل قطعة في مكانها.</p>
      <label class="field">
        <span>اسم المستخدم</span>
        <input name="username" autocomplete="username" dir="ltr" required autocapitalize="none" spellcheck="false">
      </label>
      <label class="field">
        <span>كلمة المرور</span>
        <input name="password" type="password" autocomplete="current-password" dir="ltr" required>
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">دخول</button>
    </form>
  </main>

  <!-- the panel -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a class="side-brand" href="#/">
        <img src="/assets/icon.svg" alt="" width="34" height="34">
        <span class="brand-name">PUZZLEX<span>ADMIN</span></span>
      </a>
      <nav class="side-nav" id="nav" aria-label="أقسام اللوحة">
        <a href="#/" data-route="home"><span class="ico">◆</span>الرئيسية</a>
        <a href="#/texts" data-route="texts"><span class="ico">Aa</span>النصوص</a>
        <a href="#/projects" data-route="projects"><span class="ico">▦</span>المشاريع</a>
        <a href="#/partners" data-route="partners"><span class="ico">✦</span>شعارات الشركاء</a>
        <a href="#/testimonials" data-route="testimonials"><span class="ico">”</span>آراء العملاء</a>
        <a href="#/articles" data-route="articles"><span class="ico">✎</span>المدونة</a>
        <a href="#/contact" data-route="contact"><span class="ico">☎</span>التواصل والروابط</a>
        <a href="#/stats" data-route="stats"><span class="ico">▮</span>الإحصائيات</a>
        <a href="#/messages" data-route="messages"><span class="ico">✉</span>الرسائل <b class="badge" id="unread" hidden></b></a>
        <a href="#/invoices" data-route="invoices"><span class="ico">▤</span>الفواتير والإيصالات</a>
        <a href="#/account" data-route="account"><span class="ico">⚙</span>حسابي</a>
      </nav>
      <div class="side-foot">
        <a class="btn btn-ghost btn-block" href="/" target="_blank" rel="noopener">عرض الموقع ↗</a>
        <p class="muted small" id="who"></p>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <!-- unsaved changes bar, toasts -->
  <div class="savebar" id="savebar" hidden>
    <span id="savebar-text">تغييرات غير محفوظة</span>
    <div class="savebar-actions">
      <button class="btn btn-ghost" type="button" id="savebar-undo">تراجع</button>
      <button class="btn btn-primary" type="button" id="savebar-save">حفظ التغييرات</button>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/admin/xlsx.js?v=1"></script>
  <script src="/admin/admin.js?v=13"></script>
  <script src="/invoice-doc.js?v=1"></script>
  <script src="/admin/invoices.js?v=2"></script>
  <script src="/admin/articles.js?v=1"></script>
</body>
</html>
